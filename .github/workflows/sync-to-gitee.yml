name: Sync to Gitee

on:
  push:
    branches:
      - '**' # 任意分支 push 都触发，即时同步该分支与 tag
  schedule:
    - cron: "0 4 * * *" # 每天 UTC 04:00（北京时间 12:00）兜底同步未触发的分支

jobs:
  mirror:
    name: Mirror FLAG12321/OnmyojiAutoScript to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Clone all branches and tags from GitHub
        run: |
          # --mirror 克隆远端所有分支与 tag，refs 直接作为本地 heads/tags
          git clone --mirror https://github.com/FLAG12321/OnmyojiAutoScript.git source
      - name: Force push to Gitee
        run: |
          cd source
          # 只推送分支与 tag 并 prune 删除远端已删的对应 ref，保证 Gitee 与 GitHub 分支/tag 一致
          # 不能用 --mirror 全量推送：--mirror 克隆会带回 GitHub 的 refs/pull/*（PR 引用），Gitee 拒绝更新（deny updating a hidden ref）
          # Gitee 私人令牌作为 HTTPS 密码认证
          git push --prune https://flag12321:${{ secrets.GITEE_TOKEN }}@gitee.com/flag12321/OnmyojiAutoScript.git \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
