name: Check Upstream Updates

on:
  schedule:
    - cron: '0 8 * * *'  # 每天 UTC 8:00 (北京时间 16:00) 检查一次
  workflow_dispatch:  # 支持手动触发

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/runhey/OnmyojiAutoScript.git || true
          git fetch upstream master
          git fetch origin run_now
          git fetch origin run_now_2

      - name: Compare commits
        id: compare
        run: |
          get_behind() {
            local branch="$1"
            local upstream_head
            upstream_head=$(git rev-parse upstream/master)

            if git merge-base --is-ancestor "$upstream_head" "origin/$branch"; then
              echo 0
            else
              local merge_base
              merge_base=$(git merge-base "origin/$branch" upstream/master)
              git rev-list --count "$merge_base"..upstream/master
            fi
          }

          RUN_NOW_BEHIND=$(get_behind run_now)
          RUN_NOW_2_BEHIND=$(get_behind run_now_2)

          if [ "$RUN_NOW_BEHIND" -le "$RUN_NOW_2_BEHIND" ]; then
            TARGET_BRANCH=run_now
            TARGET_BEHIND=$RUN_NOW_BEHIND
          else
            TARGET_BRANCH=run_now_2
            TARGET_BEHIND=$RUN_NOW_2_BEHIND
          fi

          echo "run_now_behind=$RUN_NOW_BEHIND" >> $GITHUB_OUTPUT
          echo "run_now_2_behind=$RUN_NOW_2_BEHIND" >> $GITHUB_OUTPUT
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "behind=$TARGET_BEHIND" >> $GITHUB_OUTPUT

          if [ "$TARGET_BEHIND" -gt 0 ]; then
            MERGE_BASE=$(git merge-base "origin/$TARGET_BRANCH" upstream/master)
            COMMITS=$(git log --oneline "$MERGE_BASE"..upstream/master | head -20)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        if: steps.compare.outputs.behind > 0
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = '${{ steps.compare.outputs.target_branch }}';
            const behind = '${{ steps.compare.outputs.behind }}';
            const runNowBehind = '${{ steps.compare.outputs.run_now_behind }}';
            const runNow2Behind = '${{ steps.compare.outputs.run_now_2_behind }}';
            const commits = `${{ steps.compare.outputs.commits }}`;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## [Upstream Sync] ${targetBranch} 落后 upstream/master ${behind} 个 commit，需要 merge\n\nrun_now 落后：${runNowBehind}\nrun_now_2 落后：${runNow2Behind}\n\n最新提交：\n\`\`\`\n${commits}\n\`\`\``
            });
