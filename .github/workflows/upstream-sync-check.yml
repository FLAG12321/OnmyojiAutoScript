name: Check Upstream Updates

on:
  schedule:
    - cron: '0 8 * * *'  # 每天 UTC 8:00 (北京时间 16:00) 检查一次
  workflow_dispatch:  # 支持手动触发

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/runhey/OnmyojiAutoScript.git || true
          git fetch upstream master
          git fetch origin master

      - name: Compare commits
        id: compare
        run: |
          BEHIND=$(git rev-list --count origin/master..upstream/master)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          if [ "$BEHIND" -gt "0" ]; then
            COMMITS=$(git log --oneline origin/master..upstream/master | head -20)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if behind
        if: steps.compare.outputs.behind > 0
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.compare.outputs.behind }}';
            const commits = `${{ steps.compare.outputs.commits }}`;
            const title = `[Upstream] master 有 ${behind} 个新 commit 待同步`;

            // 检查是否已有同类 issue 未关闭
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync'
            });

            if (issues.data.length > 0) {
              // 更新已有 issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title: title,
                body: `upstream/master 领先 origin/master **${behind}** 个 commit。\n\n**最新提交：**\n\`\`\`\n${commits}\n\`\`\``
              });
            } else {
              // 创建新 issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `upstream/master 领先 origin/master **${behind}** 个 commit。\n\n**最新提交：**\n\`\`\`\n${commits}\n\`\`\``,
                labels: ['upstream-sync']
              });
            }
